  multi_select_flutter: ^4.1.3
  dio: ^5.7.0
  responsive_framework: ^1.5.1
  device_preview: ^1.2.0
  universal_html: ^2.2.4
  path_provider: ^2.1.5
  gap: ^3.0.1
  shadcn_flutter: ^0.0.44
  go_router: ^16.2.4
  get_it: ^8.2.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  flutter_animate: ^4.5.2
  animate_do: ^4.2.0
  animated_custom_dropdown: ^3.1.1
  injectable: ^2.5.2
  dotted_border: ^3.1.0
  flutter_quill: ^11.5.0
  gpt_markdown: ^1.1.4
  share_plus: ^12.0.1
  flutter_quill_extensions: ^11.0.0
